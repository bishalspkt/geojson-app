    <!-- For agents and crawlers: what the app does and how to drive it. -->
    <link rel="alternate" type="text/markdown" href="/llms.txt" title="geojson.app for LLMs" />
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebApplication",
        "name": "geojson.app",
        "url": "https://geojson.app/",
        "image": "https://geojson.app/geojson.app.jpg",
        "logo": "https://geojson.app/icon-512x512.png",
        "description": "View, explore and share GeoJSON on a fast open-source map, with 3D terrain, timelines, satellite imagery, guided map stories and an embeddable JavaScript SDK.",
        "applicationCategory": "DeveloperApplication",
        "operatingSystem": "Any (web browser)",
        "browserRequirements": "Requires JavaScript and WebGL",
        "isAccessibleForFree": true,
        "offers": { "@type": "Offer", "price": "0", "priceCurrency": "USD" },
        "sameAs": ["https://github.com/bishalspkt/geojson-app"],
        "potentialAction": {
          "@type": "ViewAction",
          "target": "https://geojson.app/?geojson={url}",
          "name": "Open a GeoJSON URL on the map"
        }
      }
    </script>
    <!-- Basemap tiles and label glyphs: open the connections while the app boots. -->
    <link rel="preconnect" href="https://tiles.geojson.app" crossorigin />
    <link rel="preconnect" href="https://protomaps.github.io" crossorigin />
  </head>
  <body>
    <div id="root"></div>
    <noscript>geojson.app needs JavaScript to draw the map.</noscript>
    <!-- Analytics (PostHog, Google Analytics) load after the map, from src/lib/analytics.ts. -->
    <script type="module" src="/src/main.tsx"></script>
  </body>
